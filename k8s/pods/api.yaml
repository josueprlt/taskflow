apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: taskflow
  labels:
    app: taskflow
    component: api
spec:
  containers:
    - name: api
      image: josue5/taskflow-api:1.0.0
      ports:
        - containerPort: 3000
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "10.42.0.14"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: taskflow
        - name: DB_USER
          value: taskflow
        - name: DB_PASSWORD
          value: taskflow-lab
