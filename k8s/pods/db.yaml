apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: taskflow
  labels:
    app: taskflow
    component: db
spec:
  containers:
    - name: postgres
      image: postgres:17
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_DB
          value: taskflow
        - name: POSTGRES_USER
          value: taskflow
        - name: POSTGRES_PASSWORD
          value: taskflow-lab
